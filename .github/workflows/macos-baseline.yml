name: macOS cross-job baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Write synthetic artifact
        run: printf 'LAB_CANARY_20261008\n' > canary.txt
      - uses: actions/upload-artifact@v7
        with:
          name: canary
          path: canary.txt
          retention-days: 1
  consume:
    needs: produce
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: canary
          path: out
      - name: Verify runner baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat out/canary.txt)" = "LAB_CANARY_20261008"
          sw_vers
          uname -m
